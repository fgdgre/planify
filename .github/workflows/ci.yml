name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  typecheck:
    name: Generate types & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # pinned: `latest` changes the generated types format and breaks the check below
          version: 2.121.0

      - name: Generate Supabase types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm db:types

      - name: Verify generated types are committed
        run: |
          if ! git diff --exit-code app/shared/api/supabase/types/database.ts; then
            echo "::error::Supabase types are out of sync. Run 'pnpm db:types' locally and commit the result."
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  edge-functions:
    name: Edge Function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno tests (shared OAuth state, origin allow-list, CORS, HTTP helpers)
        run: deno test --no-lock supabase/functions/_shared/

  landing-demo-e2e:
    name: E2E (landing demo + auth, production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The landing demo needs no Supabase: it runs on a fake client. The build only
      # needs the public config to be present, so harmless placeholders are enough
      # (nothing is ever requested from them; the e2e fails on any *.supabase.co call).
      - name: Generate static site
        env:
          NUXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NUXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: pnpm exec nuxt generate

      - name: Verify CSP hashes were injected
        run: |
          grep -q "sha256-" .output/public/_headers || (echo "::error::CSP inline script hash was not injected into _headers" && exit 1)

      # playwright.config.ts starts scripts/serve-with-headers.mjs, which applies the
      # real _headers (CSP, sandbox framing, CORS), so this is what production serves.
      - name: Run e2e tests against the production build
        env:
          E2E_STATIC: '1'
        run: pnpm exec playwright test

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to Netlify
    needs: [typecheck, unit-tests, edge-functions, landing-demo-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate static site
        env:
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm exec nuxt generate

      - name: Verify build output
        run: |
          echo "Contents of .output/public:"
          ls -la .output/public
          test -f .output/public/index.html || (echo "::error::index.html missing from build output" && exit 1)
          test -f .output/public/_headers || (echo "::error::_headers (security headers) missing from build output" && exit 1)
          grep -q "sha256-" .output/public/_headers || (echo "::error::CSP inline script hash was not injected into _headers" && exit 1)
          grep -q "__NUXT_INLINE_SCRIPT_HASHES__" .output/public/_headers && (echo "::error::CSP placeholder left in _headers" && exit 1)
          echo "Security headers:"
          grep -E "^  (Content-Security-Policy|Strict-Transport-Security|X-Frame-Options)" .output/public/_headers

      - name: Add SPA fallback for Netlify
        run: echo '/*  /index.html  200' > .output/public/_redirects

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          pnpm --package=netlify-cli dlx netlify deploy \
            --dir=.output/public \
            --prod \
            --no-build \
            --message="GH Actions: ${{ github.sha }}"
